<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>商务合作</title>
 <link rel="icon" href="logo.png">
 <link rel="stylesheet" href="css/app.css">
 <!-- Vue3 CDN -->
 <script src="js/vue.global.js"></script>
 <!-- Lucide Icons CDN -->
 <script src="js/lucide.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div id="app" class="w-full max-w-md h-[100dvh] max-h-[900px] shadow-xl relative overflow-hidden">
    <div class="w-full h-full bg-ocean-gradient flex flex-col relative overflow-hidden">
      
      <!-- Ambient glow -->
      <div class="absolute top-0 right-0 w-64 h-64 rounded-full bg-primary/5 blur-[80px] pointer-events-none"></div>

      <!-- Status bar spacer -->
      <!-- <div class="h-12 flex-shrink-0"></div> -->

      <!-- Header -->
      <!-- <div class="relative z-10 flex items-center gap-3 px-5 pt-2 pb-4 flex-shrink-0">
        <button
          @click="onBack"
          class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors"
        >
          <i data-lucide="chevron-left" class="w-5 h-5 text-foreground"></i>
        </button>
        <h2 class="text-xl font-bold text-foreground">商务合作</h2>
      </div> -->

      <!-- Content -->
      <div class="relative z-10 flex-1 overflow-auto px-5 pb-8">

        <!-- Intro -->
        <p class="text-sm text-muted-foreground leading-relaxed mb-6">
          雄鹰加速器拥有大量活跃的海外互联网用户，如果您希望在此触达这一群体，欢迎与我们联系探讨合作可能。
        </p>

        <!-- Coop types -->
        <div class="space-y-3 mb-8">
          <div 
            v-for="item in coopTypes" 
            :key="item.title" 
            class="glass-card rounded-2xl border-0 p-4 flex items-start gap-3"
          >
            <div :class="['w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 mt-0.5', item.bg]">
              <i :data-lucide="item.icon" :class="['w-4 h-4', item.color]"></i>
            </div>
            <div>
              <p class="text-sm font-semibold text-foreground mb-1">{{ item.title }}</p>
              <p class="text-xs text-muted-foreground leading-relaxed">{{ item.desc }}</p>
            </div>
          </div>
        </div>

        <!-- Contact -->
        <div class="glass-card rounded-2xl border-0 p-5">
          <p class="text-sm font-semibold text-foreground mb-1">联系我们</p>
          <p class="text-xs text-muted-foreground mb-4">发送邮件说明您的合作意向，我们会尽快回复。</p>
          <a
            href="mailto:app@unitedcloud.net"
            class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl bg-primary/10 hover:bg-primary/15 active:scale-[0.98] transition-all"
          >
            <i data-lucide="mail" class="w-4 h-4 text-primary flex-shrink-0"></i>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-medium text-foreground">商务邮箱</p>
              <p class="text-[11px] text-primary/80 mt-0.5">bianmeng.net@outlook.com</p>
            </div>
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, nextTick } = Vue;

    createApp({
      setup() {
        // 合作类型数据
        const coopTypes = ref([
          {
            icon: 'megaphone',
            color: 'text-[#ff6b35]',
            bg: 'bg-[#ff6b35]/10',
            title: '广告投放',
            desc: '开屏、激励视频、信息流等多种形式，精准触达海外互联网活跃用户群体。',
          },
          {
            icon: 'globe',
            color: 'text-primary',
            bg: 'bg-primary/10',
            title: '出海推广',
            desc: '雄鹰用户高度活跃于海外平台，是出海 App、跨境电商、海外游戏的优质推广渠道。',
          },
          {
            icon: 'users',
            color: 'text-[#34c759]',
            bg: 'bg-[#34c759]/10',
            title: '资源置换',
            desc: '与工具类、内容类 App 互换资源，双向触达，共同扩大用户规模。',
          },
          {
            icon: 'handshake',
            color: 'text-[#af52de]',
            bg: 'bg-[#af52de]/10',
            title: '品牌合作',
            desc: '应用内功能模块冠名、品牌植入等深度合作形式，长期曝光，建立品牌认知。',
          },
        ]);

       
        // 渲染 Lucide 图标
        const renderIcons = () => {
          nextTick(() => {
            if (window.lucide) {
              lucide.createIcons();
            }
          });
        };

        onMounted(() => {
          renderIcons();
        });

        return {
          coopTypes
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
